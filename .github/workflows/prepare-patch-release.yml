name: Prepare patch release
run-name: Prepare patch release on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ github.ref }}

jobs:
  prepare-patch-release:
    name: Prepare patch release
    runs-on: ubuntu-latest

    steps:
      - name: Check ref
        run: |
          # An older major has no released branch of its own: its stable release tags already
          # point at exactly what shipped, so a patch is branched from one of those instead.
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/release-*)
              ;;
            *)
              echo "::error::Run this on main or on a stable release tag (release-<major>.<minor>.<patch>), not $GITHUB_REF_NAME. Use 'Prepare release' to cut a minor release from a development branch."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Avoid a shallow clone so nbgv can calculate the version height

      - name: Set up Nerdbank.GitVersioning
        uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2

      - name: Prepare patch release
        id: prepare
        run: |
          set -euo pipefail

          currentVersion=$(jq -r '.version // empty' version.json)

          # A released commit holds a plain <major>.<minor>.<patch>, and the branch this creates
          # is named from it, so validate before anything is pushed rather than after.
          if ! printf '%s' "$currentVersion" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME is at version '${currentVersion:-<missing>}', but a patch release needs a released '<major>.<minor>.<patch>' version."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "release-$currentVersion" ]; then
            echo "::error::$GITHUB_REF_NAME holds version '$currentVersion' instead of the version in its name, so it is not a stable release tag."
            exit 1
          fi

          major=${currentVersion%%.*}
          minorAndPatch=${currentVersion#*.}
          minor=${minorAndPatch%%.*}
          patch=${minorAndPatch#*.}
          nextVersion="$major.$minor.$(( patch + 1 ))"
          releaseBranch="release/$nextVersion"

          # Patching anything but the latest patch of a minor would cut a version that already
          # shipped, so point at the newer tag rather than fail later at the draft release.
          if git show-ref --verify --quiet "refs/tags/release-$nextVersion"; then
            echo "::error::release-$nextVersion already exists. Run this on the latest release tag of $major.$minor instead."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$releaseBranch"; then
            echo "::error::$releaseBranch already exists. Continue on it, or delete it first if it was abandoned."
            exit 1
          fi

          echo "release-branch=$releaseBranch" >> "$GITHUB_OUTPUT"

          echo "Released version: $currentVersion"
          echo "Patch version:    $nextVersion"
          echo "Release branch:   $releaseBranch"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Patches ship straight to a stable version, so no prerelease tag is applied here.
          # Run 'Prepare release' on the new branch if this one does need stabilising first.
          git checkout -b "$releaseBranch"
          nbgv set-version "$nextVersion"
          git commit version.json --message "Set version to '$nextVersion'"

          git push origin "$releaseBranch"

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          release-branch: ${{ steps.prepare.outputs.release-branch }}
